# DOSBox Staging settings for Where Are We? (the "with Where Are We?" option of
# eXo's launchers). eXo's launchers load it after the game's own configs.

[webserver]
# Where Are We? reads and writes the game's memory through the HTTP API; it
# looks for it on 127.0.0.1, port 8086 or 8080.
webserver_enabled = on
webserver_port = 8086

[mt32]
# eXo's MT-32 ROMs (the games' configs name them the DOSBox ECE way, which
# Staging doesn't read).
romdir = .\mt32
