# Loaded last by the test tools (exo_bootcheck.py, exo_optioncheck.py, run_staging_exo.py, layout_check.py): their
# DOSBox listens on 18086, so it never takes the port the "with Where Are We?" launcher option uses (8086) from a
# game the user plays, and it is silent: the mixer mutes (sound is still emulated) and MIDI goes nowhere (a
# mididevice = auto could reach Windows' own synthesizer past the mixer; the games still see their MPU-401).
[webserver]
webserver_port = 18086

[mixer]
nosound = true

[midi]
mididevice = none
